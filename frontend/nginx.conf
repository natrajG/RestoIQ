server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;  # re-resolve the api container so API redeploys do not cause 502s

    # Worker-only endpoints: the vision container reaches the api over the internal network, never through here
    location /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        client_max_body_size 600m;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;  # the original /api/... path is passed through unchanged
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
